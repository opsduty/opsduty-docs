name: ci
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv installs the interpreter named in .python-version itself, so there is no
      # separate python setup step. `make build` runs `uv sync --locked`.
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Node project
        uses: ./.github/actions/setup-node
        with:
          node-version-file: .tool-versions

      - run: make lint
      - run: make build
