name: release
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # uv installs the interpreter named in .python-version itself, so there is no
      # separate python setup step.
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Previously bare `mkdocs`, which worked only because the old composite action put
      # .venv/bin on $GITHUB_PATH. uv run resolves it from uv.lock instead.
      - run: uv run mkdocs gh-deploy --force
