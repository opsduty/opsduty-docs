[project]
name = "opsduty-docs"
version = "0.0.1"
description = "Incident management system."
authors = [
    { name = "Eirik Martiniussen Sylliaas", email = "eirik@sylliaas.no" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "mkdocs-material[imaging]>=9.7.6,<10.0.0",
]

[tool.uv]
# The old [tool.poetry] section set package-mode = false: this repo is a docs site, not a
# distributable package, so there is nothing to build or install into the environment.
package = false
